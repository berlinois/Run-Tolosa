<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Run Tolosa</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#B8505E" />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        background: radial-gradient(circle at 50% 45%, #C9586D, #7E2A3B 75%);
        transition: transform .65s cubic-bezier(.6, 0, .3, 1), opacity .65s ease-in;
      }
      #splash img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #splash.leaving { transform: translateY(-100%); opacity: .4; }
    </style>
  </head>
  <body>
    <!-- Écran d'accueil : affiché dès le chargement, retiré par SplashService
         quand la carte est prête et centrée sur la position. -->
    <div id="splash" aria-hidden="true">
      <img src="splash.svg" alt="" />
    </div>
    <app-root></app-root>
  </body>
</html>
